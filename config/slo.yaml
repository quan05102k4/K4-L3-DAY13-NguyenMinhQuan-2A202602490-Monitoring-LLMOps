service: day13-l3b-monitoring-llmops-lab
owner: student-2A202602490
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >-
    Baseline đo trên máy lab (10 request mẫu, không incident): P50 ~150ms, P95 ~155-190ms,
    TTFT P95 50ms. Ngưỡng 3000ms giữ trùng threshold panel latency trong config/dashboard.yaml
    để SLO và dashboard nói cùng một ngôn ngữ, đồng thời chừa headroom ~15x so với baseline
    cho LLM thật (chậm hơn fake LLM). Một request "bad" là request lỗi (request_failed)
    hoặc thành công nhưng chậm hơn 3000ms. Target 99.5% thay vì 99.9% vì app phụ thuộc
    hai dependency ngoài (vector store, LLM provider) mà ta không kiểm soát SLA.
  error_budget:
    formula: 'allowed_bad = total_requests * (100 - target_percent) / 100'
    example: >-
      10,000 request / 28 ngày -> được phép tối đa 50 request lỗi hoặc > 3000ms.
      Trong practice tool_fail, 10/41 request lỗi (24.4%) nên chỉ trong vài phút đã đốt
      hết budget của cả cửa sổ nếu traffic thật thấp -> đó là lý do alert error rate là critical.
    burn_rate_policy: >-
      Burn rate = bad_ratio / 0.005. Burn rate >= 14.4 trong 1h (đốt 2% budget/giờ) -> page ngay;
      burn rate >= 6 trong 6h -> ticket. Khi budget còn < 25% thì đóng băng thay đổi prompt/model,
      chỉ cho phép rollback và fix reliability.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
